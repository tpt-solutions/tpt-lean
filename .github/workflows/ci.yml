name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: SPDX headers
        if: runner.os != 'Windows'
        run: bash scripts/check-spdx.sh

  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  license-report:
    name: Dependency license report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Generate report
        run: bash scripts/license-report.sh > licenses-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses-report.txt

  lean-integration:
    name: Lean ${{ matrix.lean }} integration (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lean: [v4.35.0, v4.36.0]
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:${{ matrix.lean }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean ${{ matrix.lean }}
        run: elan toolchain install leanprover/lean4:${{ matrix.lean }}
      - name: Build the sidecar for this Lean version
        working-directory: lean/tpt-lean-sidecar
        run: |
          if [ "${{ matrix.lean }}" = "v4.36.0" ]; then
            lake -R build
          else
            lake -R build -K buildDirName=.lake/build-${{ matrix.lean }}
          fi
      - name: Tests against this Lean version
        run: cargo test --workspace

  benchmarks:
    name: Benchmarks (advisory, ubuntu)
    runs-on: ubuntu-latest
    # Timing on shared runners is noisy, so a missed target is reported but does not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Run the benchmarks (release build)
        shell: bash
        run: |
          set -o pipefail
          for crate in tpt-lean-search tpt-lean-fmt tpt-lean-index; do
            echo "== $crate" | tee -a bench-results.txt
            cargo test -p "$crate" --release --test bench -- --ignored --nocapture 2>&1 | tee -a bench-results.txt
          done
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt
