[package]
name = "tpt-lean-cli"
description = "Command-line interface for tpt-lean, shipping the tpt-lean and tlean binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cli", "lean", "lean4", "lake", "tooling"]
categories = ["command-line-utilities", "development-tools"]
repository.workspace = true
autobins = false

[[bin]]
name = "tpt-lean"
path = "src/main.rs"

[[bin]]
name = "tlean"
path = "src/bin/tlean.rs"

[dependencies]
tpt-lean-core.workspace = true
tpt-lean-syntax.workspace = true
tpt-lean-index.workspace = true
tpt-lean-search.workspace = true
tpt-lean-fmt.workspace = true
tpt-lean-adapter.workspace = true
tpt-lean-mcp.workspace = true
tpt-lean-server.workspace = true
tpt-lean-docgen.workspace = true
tpt-lean-profile.workspace = true
tpt-lean-build.workspace = true
tpt-lean-lsp.workspace = true
tpt-lean-tools.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# `cargo binstall tpt-lean-cli` downloads the GitHub Release archive built by
# .github/workflows/release.yml: tpt-lean-<target>.tar.gz (or .zip on Windows), with the
# `tpt-lean` and `tlean` binaries at the top of the archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tpt-lean-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
