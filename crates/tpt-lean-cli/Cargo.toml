tpt-lean-adapter.workspace = true
tpt-lean-mcp.workspace = true
tpt-lean-server.workspace = true
tpt-lean-docgen.workspace = true
tpt-lean-profile.workspace = true
tpt-lean-build.workspace = true
tpt-lean-lsp.workspace = true
tpt-lean-tools.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
