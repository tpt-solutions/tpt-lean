[package]
name = "tpt-lean-wasm"
description = "Restricted, browser-safe WebAssembly bindings for tpt-lean: tokenizer, formatter and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["wasm", "webassembly", "lean", "lean4", "browser"]
categories = ["wasm", "development-tools"]
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-lean-syntax.workspace = true
tpt-lean-fmt.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pinned to the wasm-bindgen CLI version used to generate the JS glue (see npm/README.md).
wasm-bindgen = "=0.2.126"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
